# Standard label set for every GITHUB Community GITAM repository.
# Synced automatically by .github/workflows/labels.yml on every push to main.
# Owned by OS & DevX — do not edit per-repo; raise a PR against the shared pack.

# --- Hacktoberfest ---
- name: "hacktoberfest"
  color: "FF8AE2"
  description: "Counts toward Hacktoberfest 2026"
- name: "hacktoberfest-accepted"
  color: "1F883D"
  description: "Reviewed and accepted by a maintainer"

# --- Entry points ---
- name: "good first issue"
  color: "7057FF"
  description: "Great for your very first pull request"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would like community help here"

# --- Difficulty ---
- name: "difficulty: beginner"
  color: "C2E0C6"
  description: "No prior knowledge of the codebase needed"
- name: "difficulty: intermediate"
  color: "FEF2C0"
  description: "Requires reading existing code"
- name: "difficulty: advanced"
  color: "F9D0C4"
  description: "Design decisions involved"

# --- Type ---
- name: "bug"
  color: "D73A4A"
  description: "Something is broken"
- name: "documentation"
  color: "0075CA"
  description: "Docs, README, guides"
- name: "enhancement"
  color: "A2EEEF"
  description: "New feature or request"
- name: "design"
  color: "D4C5F9"
  description: "Visual or UX work"
- name: "security"
  color: "B60205"
  description: "Security-relevant change"
- name: "ci"
  color: "BFD4F2"
  description: "GitHub Actions, linting, automation"
- name: "test-coverage"
  color: "0E8A16"
  description: "Adding or improving tests"
- name: "accessibility"
  color: "5319E7"
  description: "Making the project usable by everyone"

# --- Workflow state ---
- name: "status: claimed"
  color: "FBCA04"
  description: "Assigned to a contributor — do not start work on this"
- name: "status: needs-review"
  color: "5319E7"
  description: "Waiting on a maintainer (48h SLA)"
- name: "status: changes-requested"
  color: "E99695"
  description: "Contributor needs to push a fix"
- name: "status: blocked"
  color: "000000"
  description: "Waiting on something else"

# --- Anti-spam ---
- name: "invalid"
  color: "E4E669"
  description: "Does not meet contribution standards"
- name: "spam"
  color: "B60205"
  description: "Low-effort or automated submission — excluded from Hacktoberfest"

# --- Domains ---
- name: "domain: os-devx"
  color: "0E8A16"
  description: "Open Source & Developer Experience"
- name: "domain: agentic-dev"
  color: "1D76DB"
  description: "Agentic Development"
- name: "domain: web-eng"
  color: "5319E7"
  description: "Web Engineering"
- name: "domain: digital-defence"
  color: "B60205"
  description: "Digital Defence"
- name: "domain: editorial"
  color: "0075CA"
  description: "Technical Editorial & Documentation"
- name: "domain: creative"
  color: "D4C5F9"
  description: "Creative Studio"
