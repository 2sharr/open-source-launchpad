name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug", "hacktoberfest"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Your environment
      placeholder: "OS: macOS 14 / Python 3.11 / Chrome 130"
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
