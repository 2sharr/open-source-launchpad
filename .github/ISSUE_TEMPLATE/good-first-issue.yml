name: "Good first issue (maintainers only)"
description: Template maintainers use to create beginner-friendly tasks.
title: "[Good first issue] "
labels: ["good first issue", "hacktoberfest", "difficulty: beginner"]
body:
  - type: markdown
    attributes:
      value: |
        **Maintainers:** fill every section. An issue a beginner cannot start
        without asking a question is not a good first issue.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is this part of the project, and why does this task matter?
      placeholder: The scoreboard shows the top 5 players after each game...
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What to change
      description: Name the exact file and function. Link to the lines.
      placeholder: |
        File: `arcade/scoreboard.py`
        Function: `top_scores()`
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. When every box is ticked, the PR gets merged.
      value: |
        - [ ] 
        - [ ] 
        - [ ] Existing tests still pass
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify locally
      description: The exact commands to run.
      render: shell
    validations:
      required: true
  - type: input
    id: mentor
    attributes:
      label: Mentor
      description: Who to ping if stuck.
      placeholder: "@your-handle"
